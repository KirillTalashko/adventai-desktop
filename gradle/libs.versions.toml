# Version catalog (шаг B1 плана .claude/MODULARIZATION.md). До него версии жили литералами в семи
# build-файлах: один Ktor 3.1.3 повторялся 19 раз. Правило — версия объявляется РОВНО здесь.

[versions]
# Kotlin и Compose связаны: плагин compose-compiler идёт версией Kotlin.
kotlin = "2.1.21"
compose = "1.7.3"
coroutines = "1.10.2"
serialization = "1.8.1"
ktor = "3.1.3"
# Koin 4.1.1, а не 4.2.x: та собрана на Kotlin 2.3.20, метаданные которой компилятор 2.1.21 не читает.
koin = "4.1.1"
# MCP 0.10.0 — последняя на Kotlin 2.2.x; 0.11+ собраны на 2.3 и несовместимы (та же причина).
mcp = "0.10.0"
sqlite = "3.49.1.0"
slf4j = "2.0.16"
junit = "5.14.4"
shadow = "8.3.6"
# B3 — гейт границ и метрики god-object.
detekt = "1.23.8"          # 1.23.x собран на Kotlin 1.9; правила сложности типы не резолвят — совместим
moduleGraphAssert = "2.9.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }

mcp-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version.ref = "mcp" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

# Без version: версию задаёт junit-bom, подключаемый как platform().
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
# Ровно этот набор нужен всем трём потребителям HTTP-клиента (data, mcp, service).
ktor-client = ["ktor-client-core", "ktor-client-cio", "ktor-client-contentNegotiation", "ktor-serialization-json"]
# SSE отдельно: он нужен только MCP-серверу (транспорт на VPS), сервису — нет.
ktor-server = ["ktor-server-core", "ktor-server-cio", "ktor-server-auth"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
moduleGraphAssert = { id = "com.jraska.module.graph.assertion", version.ref = "moduleGraphAssert" }
